# $schema:https://www.schemastore.org/flatpak-manifest
---
app-id: io.github.mattiasb.MagicSetEditor2
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
branch: stable
command: magicseteditor
finish-args:
  - --socket=wayland
cleanup:
  - /include
  - /lib/debug
  - "*.a"

modules:
  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --with-libraries=regex --prefix=/app
      - ./b2 -j $FLATPAK_BUILDER_N_JOBS link=shared
      - ./b2 install
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.75.0/source/boost_1_75_0.tar.gz
        sha256: aeb26f80e80945e82ee93e5939baebdca47b9dee80a07d3144be1e1a6a66dd6a
    cleanup:
      - /lib/cmake

  - name: wxwidgets
    sources:
      - type: git
        url: https://github.com/wxWidgets/wxWidgets.git
        tag: v3.3.1
        commit: 49c6810948f40c457e3d0848b9111627b5b61de5
    cleanup:
      - /bin
      - /lib/wx/config
      - /lib/wx/include
      - /share/aclocal
      - /share/bakefile

  - name: templates
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/MagicSetEditorPacks/Full-Magic-Pack.git
        commit: add2e3b9796547c4cbe80e93965679cc484a7489
    build-commands:
      - mkdir -p /app/share/magicseteditor/data/ /app/share/fonts
      - cp -r data/* /app/share/magicseteditor/data/
      - cp -r 'Magic - Fonts'/*.ttf /app/share/fonts

  - name: magicseteditor2
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/mattiasb/MagicSetEditor2.git
        branch: feature/haganbmj2-cmake-install
        commit: 50401491b5e526a9abcc4d85b8b71b1eea1db10c
    cleanup:
      - /share/magicseteditor/resource/icon
      - /share/magicseteditor/resource/win32_res.rc
