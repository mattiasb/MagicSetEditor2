---
app-id: io.github.mattiasb.MagicSetEditor2
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
branch: stable
command: magicseteditor
finish-args:
  - --socket=fallback-x11
cleanup:
  - /include
  - /lib/debug
  - '*.a'

modules:
  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --with-libraries=regex --prefix=/app
      - ./b2 -j $FLATPAK_BUILDER_N_JOBS link=shared
      - ./b2 install
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.75.0/source/boost_1_75_0.tar.gz
        sha256: aeb26f80e80945e82ee93e5939baebdca47b9dee80a07d3144be1e1a6a66dd6a
    cleanup:
      - /lib/cmake

  - name: wxwidgets
    sources:
      - type: git
        url: https://github.com/wxWidgets/wxWidgets.git
        tag: v3.1.5
        commit: 9c0a8be1dc32063d91ed1901fd5fcd54f4f955a1
    cleanup:
      - /bin
      - /lib/wx/config
      - /lib/wx/include
      - /share/aclocal
      - /share/bakefile

  - name: templates
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/MagicSetEditorPacks/Full-Magic-Pack.git
        commit: add2e3b9796547c4cbe80e93965679cc484a7489
    build-commands:
      - mkdir -p /app/share/magicseteditor/data/
      - cp -r data/* /app/share/magicseteditor/data/

  - name: magicseteditor2
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/mattiasb/MagicSetEditor2.git
        branch: feature/haganbmj-cmake-install
        commit: 8059e76880729bc737d87b08d9f454032eee524a
    cleanup:
      - /share/magicseteditor/resource/icon
      - /share/magicseteditor/resource/win32_res.rc
